services:
  bot:
    build: .
    image: reimbursement-bot:latest
    # Note: no `container_name` — Dokploy manages container names; setting one
    # breaks its logs/metrics features.
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TEMP_DIR=/tmp/reimbursement
    # Temporary filesystem for in-flight request processing, owned by the
    # non-root `bot` user (uid 1000) baked into the image.
    tmpfs:
      - /tmp/reimbursement:size=64m,mode=0770,uid=1000,gid=1000
    # Durable state survives container rebuilds/restarts: SQLite audit ledger
    # (receipts.db), session store (sessions.db), and their backups. The image
    # pre-creates these dirs owned by uid 1000 so named volumes inherit them.
    volumes:
      - data:/app/data
      - backups:/app/backups

# Persistent volumes for durable runtime state. No secrets in the image;
# they are injected at runtime from .env.
volumes:
  data:
  backups:
